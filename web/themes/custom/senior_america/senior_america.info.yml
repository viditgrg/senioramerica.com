# This theme is marked as @internal. It is intended to evolve and change over
# minor releases.
# As the UI of Drupal improves between minor versions, the markup and assets in
# the senior_america theme will change. The senior_america theme is not backwards compatible
# If you wish to modify the output or assets of senior_america you can:
# 1. Copy the whole of senior_america and rename it as your own theme. You will need to
# manually manage your own updates if you want to stay up to date with senior_america's
# bug fixes and feature support.
#
# 2. Sub-theme senior_america. This is only recommended if you want to make minor
# tweaks and understand that senior_america could break your modifications as it
# changes.
name: senior_america
type: theme
base theme: false
description: A clean, accessible, and flexible Drupal front-end theme.
alt text: Screenshot of senior_america, Drupal front-end theme.
package: Core
core_version_requirement: ^10 || ^11
version: VERSION
libraries:
  - senior_america/global-styling
regions:
  header: Header
  primary_menu: Primary menu
  secondary_menu: Secondary menu
  hero: Hero (full width)
  highlighted: Highlighted
  breadcrumb: Breadcrumb
  social: Social Bar
  content_above: Content Above
  content: Content
  sidebar: Sidebar
  content_below: Content Below
  footer_top: Footer Top
  footer_bottom: Footer Bottom

